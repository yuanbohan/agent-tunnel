name: Release Relay Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yuanbohan/agent-tunnel-relay

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          if [ "$REF_TYPE" != "tag" ]; then
            printf 'error: Release Relay Image must run from a git tag, got ref type %s\n' "$REF_TYPE" >&2
            exit 1
          fi
          version="$REF_NAME"
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            printf 'error: version must look like vX.Y.Z, got %s\n' "$version" >&2
            exit 1
          }
          if [ "$REF_NAME" != "$version" ]; then
            printf 'error: checked-out ref %s does not match release version %s\n' "$REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Resolve build time
        id: build_time
        run: printf 'value=%s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run test suite
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=agent-tunnel-relay
            org.opencontainers.image.description=Agent Tunnel Relay service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            DISTRIBUTION_MARKER=official-release
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}

      - name: Verify image version
        run: |
          got="$(docker run --rm "$IMAGE_NAME:${{ steps.version.outputs.version }}" version | awk 'NR==1 {print $2}')"
          want="${{ steps.version.outputs.version }}"
          if [ "$got" != "$want" ]; then
            printf 'error: relay image reports %s, want %s\n' "$got" "$want" >&2
            exit 1
          fi
          printf 'verified relay image version: %s\n' "$got"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE_NAME:${{ steps.version.outputs.version }}"
