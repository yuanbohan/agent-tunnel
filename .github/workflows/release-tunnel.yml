name: Release Tunnel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in the form vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TUNNEL_DIST_REPO: yuanbohan/tunnel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        run: ./scripts/render-latest-manifest.sh "$RELEASE_VERSION" >/dev/null

      - name: Run test suite
        run: go test ./...

      - name: Run release smoke tests
        run: |
          make test-release-package
          make test-release-installer
          make test-release-publish

      - name: Package release artifacts
        env:
          TUNNEL_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.TUNNEL_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TUNNEL_RELEASE_SIGNING_PRIVATE_KEY" ]; then
            echo "error: TUNNEL_RELEASE_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          make release-package RELEASE_VERSION="$RELEASE_VERSION"

      - name: Verify packaged binary
        run: |
          archive="dist/releases/$RELEASE_VERSION/tunnel_${RELEASE_VERSION}_linux_amd64.tar.gz"
          extract_dir=$(mktemp -d)
          tar -xzf "$archive" -C "$extract_dir" tunnel
          got=$("$extract_dir/tunnel" --version)
          want="tunnel $RELEASE_VERSION"
          if [ "$got" != "$want" ]; then
            printf 'error: packaged binary reports %s, want %s\n' "$got" "$want" >&2
            exit 1
          fi
          printf 'verified: %s\n' "$got"

      - name: Require public distribution token
        env:
          TUNNEL_DIST_REPO_TOKEN: ${{ secrets.TUNNEL_DIST_REPO_TOKEN }}
        run: |
          if [ -z "$TUNNEL_DIST_REPO_TOKEN" ]; then
            echo "error: TUNNEL_DIST_REPO_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Publish public release
        env:
          TUNNEL_DIST_REPO_TOKEN: ${{ secrets.TUNNEL_DIST_REPO_TOKEN }}
          TUNNEL_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.TUNNEL_RELEASE_SIGNING_PRIVATE_KEY }}
        run: ./scripts/publish-tunnel-release.sh "$RELEASE_VERSION"

      - name: Verify public install
        run: |
          install_dir=$(mktemp -d)
          for i in $(seq 1 12); do
            manifest_version=$(curl -fsSL "https://raw.githubusercontent.com/$TUNNEL_DIST_REPO/main/latest.json" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            [ "$manifest_version" = "$RELEASE_VERSION" ] && break
            printf 'latest.json shows %s, waiting for %s (attempt %s/12)...\n' "${manifest_version:-<empty>}" "$RELEASE_VERSION" "$i"
            sleep 10
          done
          if [ "$manifest_version" != "$RELEASE_VERSION" ]; then
            printf 'error: latest.json did not update to %s after 2 minutes\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/$TUNNEL_DIST_REPO/main/install.sh" | \
            TUNNEL_INSTALL_DIR="$install_dir" sh
          got=$("$install_dir/tunnel" --version)
          want="tunnel $RELEASE_VERSION"
          if [ "$got" != "$want" ]; then
            printf 'error: installed binary reports %s, want %s\n' "$got" "$want" >&2
            exit 1
          fi
          printf 'verified: %s\n' "$got"
