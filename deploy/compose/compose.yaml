services:
  postgres:
    image: postgres:16.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
      - ../postgres/latest.sql:/docker-entrypoint-initdb.d/001-agentunnel-latest.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  relay:
    image: ghcr.io/yuanbohan/agent-tunnel-relay:${RELAY_IMAGE_TAG:?set RELAY_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable
      RELAY_APP_SECRET: ${RELAY_APP_SECRET:?set RELAY_APP_SECRET}
      RELAY_OPERATOR_TOKEN: ${RELAY_OPERATOR_TOKEN:?set RELAY_OPERATOR_TOKEN}
      RELAY_LISTEN_ADDR: 0.0.0.0:8586
      RELAY_LOG_FILE: /var/log/agentunnel/relay.log
    ports:
      - ${RELAY_HOST_BIND:-127.0.0.1}:${RELAY_HOST_PORT:-8586}:8586
    volumes:
      - ../logs/relay:/var/log/agentunnel

volumes:
  relay-postgres-data:
    name: ${RELAY_POSTGRES_VOLUME:-relay-postgres-data}
