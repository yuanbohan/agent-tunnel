# Copy this file to `ansible/host_vars/relay-cn/relay-secrets.yml` and fill values.
# Keep secrets out of source control.
# For Docker Compose relay-cn operations, keep runtime Relay/PostgreSQL secrets
# only in the remote `/opt/agentunnel/compose/.env`.

# Required for private GHCR Relay image pulls.
relay_ghcr_token: ""

# Required for relay-cn TLS bootstrap on the host nginx/certbot path.
relay_certbot_email: "you@example.com"
