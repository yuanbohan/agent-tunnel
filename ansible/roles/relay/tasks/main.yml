---
- name: Ensure relay runtime config directory exists
  ansible.builtin.file:
    path: "{{ relay_env_file | dirname }}"
    state: directory
    mode: "0755"
  tags:
    - relay-env

- name: Ensure schema directory exists
  ansible.builtin.file:
    path: "{{ relay_schema_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - schema

- name: Clear old relay schema files
  ansible.builtin.file:
    path: "{{ relay_schema_dir }}"
    state: absent
  tags:
    - schema

- name: Recreate schema directory
  ansible.builtin.file:
    path: "{{ relay_schema_dir }}"
    state: directory
    mode: "0755"
  tags:
    - schema

- name: Sync relay schema SQL files
  ansible.builtin.copy:
    src: "{{ relay_local_schema_dir }}/"
    dest: "{{ relay_schema_dir }}/"
    remote_src: false
  tags:
    - schema

- name: Install relay migrator binary
  ansible.posix.synchronize:
    src: "{{ relay_local_bin_dir }}/relay-migrate"
    dest: "{{ relay_install_root }}/relay-migrate"
    rsync_path: "sudo rsync"
    archive: yes
    owner: false
    group: false
    perms: false
  tags:
    - relay-migrator

- name: Set permissions for relay migrator binary
  ansible.builtin.file:
    path: "{{ relay_install_root }}/relay-migrate"
    owner: root
    group: root
    mode: "0755"
  tags:
    - relay-migrator

- name: Install relay binary
  ansible.posix.synchronize:
    src: "{{ relay_local_bin_dir }}/relay"
    dest: "{{ relay_install_root }}/relay"
    rsync_path: "sudo rsync"
    archive: yes
    owner: false
    group: false
    perms: false
  tags:
    - relay-binary

- name: Set permissions for relay binary
  ansible.builtin.file:
    path: "{{ relay_install_root }}/relay"
    owner: root
    group: root
    mode: "0755"
  tags:
    - relay-binary

- name: Render relay env file
  ansible.builtin.template:
    src: "{{ relay_template_dir }}/relay-env.j2"
    dest: "{{ relay_env_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags:
    - relay-env

- name: Render relay systemd service
  ansible.builtin.template:
    src: "{{ relay_template_dir }}/agentunnel-relay.service.j2"
    dest: /etc/systemd/system/agentunnel-relay.service
    mode: "0644"
  tags:
    - relay-service

- name: Run relay schema migrations
  ansible.builtin.command:
    cmd: "{{ relay_install_root }}/relay-migrate --env-file {{ relay_env_file }} --schema-dir {{ relay_schema_dir }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - migrate

- name: Restart relay service
  ansible.builtin.systemd:
    name: "{{ relay_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
  tags:
    - relay-restart
