---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - deps

- name: Install base system packages
  ansible.builtin.apt:
    name: "{{ relay_base_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - deps
